<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="MCP State Twin 项目卡片">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F7FF"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6C63FF"/><stop offset=".52" stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".10"/></filter>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',Arial,sans-serif} .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;fill:#64748B}.t{font-size:30px;font-weight:760;fill:#172033}.s{font-size:15px;fill:#64748B}.chip{font-size:11px;font-weight:650;fill:#172033}.n{font-size:12px;font-weight:700;fill:#172033}.m{font-size:10px;fill:#94A3B8}</style>
</defs>
<rect x="1" y="1" width="1198" height="298" rx="28" fill="url(#bg)" stroke="#DDE5F0"/>
<rect x="0" y="0" width="10" height="300" rx="5" fill="url(#accent)"/>
<text x="48" y="54" class="k">SELECTED WORK / OPEN SOURCE</text>
<text x="48" y="98" class="t">MCP State Twin</text>
<text x="48" y="132" class="s">用于可复现 AI Agent 评测的确定性、可分叉、有状态 MCP 测试世界。</text>
<text x="48" y="158" class="s">从同一快照分叉多个世界，让不同 Agent 走不同合法轨迹，再比较最终状态。</text>
<g transform="translate(48 192)">
  <g><rect width="56" height="28" rx="14" fill="#F3F4FF" stroke="#D9D6FF"/><text x="28" y="18" text-anchor="middle" class="chip">Go</text></g>
  <g transform="translate(66)"><rect width="68" height="28" rx="14" fill="#F3F4FF" stroke="#D9D6FF"/><text x="34" y="18" text-anchor="middle" class="chip">MCP</text></g>
  <g transform="translate(144)"><rect width="118" height="28" rx="14" fill="#F3F4FF" stroke="#D9D6FF"/><text x="59" y="18" text-anchor="middle" class="chip">Stateful Eval</text></g>
  <g transform="translate(272)"><rect width="108" height="28" rx="14" fill="#F3F4FF" stroke="#D9D6FF"/><text x="54" y="18" text-anchor="middle" class="chip">SQLite</text></g>
  <g transform="translate(390)"><rect width="126" height="28" rx="14" fill="#F3F4FF" stroke="#D9D6FF"/><text x="63" y="18" text-anchor="middle" class="chip">Deterministic</text></g>
</g>
<text x="48" y="263" class="m">github.com/augety121/MCP-State-Twin</text>
<!-- fork visual -->
<g transform="translate(700 34)">
  <rect width="452" height="232" rx="24" fill="#F8FAFC" stroke="#DDE5F0"/>
  <text x="25" y="30" class="k">SNAPSHOT → FORK → ACT → DIFF</text>
  <g transform="translate(28 56)">
    <rect x="0" y="44" width="100" height="54" rx="15" fill="#FFFFFF" stroke="#DDE5F0"/><text x="50" y="68" text-anchor="middle" class="n">Snapshot S₀</text><text x="50" y="84" text-anchor="middle" class="m">immutable</text>
    <path d="M100 71 H154 M154 71 V24 H204 M154 71 V118 H204" fill="none" stroke="#6C63FF" stroke-width="2"/>
    <g transform="translate(204 0)"><rect width="86" height="48" rx="14" fill="#FFFFFF" stroke="#DDE5F0"/><text x="43" y="21" text-anchor="middle" class="n">Fork A</text><text x="43" y="36" text-anchor="middle" class="m">Agent A</text></g>
    <g transform="translate(204 94)"><rect width="86" height="48" rx="14" fill="#FFFFFF" stroke="#DDE5F0"/><text x="43" y="21" text-anchor="middle" class="n">Fork B</text><text x="43" y="36" text-anchor="middle" class="m">Agent B</text></g>
    <path d="M290 24 H334 M290 118 H334" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <g transform="translate(334 48)"><rect width="72" height="48" rx="14" fill="url(#accent)"/><text x="36" y="21" text-anchor="middle" style="font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Diff</text><text x="36" y="36" text-anchor="middle" style="font:500 9px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff;opacity:.85">terminal</text></g>
    <path d="M334 24 C320 24 320 64 334 72 M334 118 C320 118 320 80 334 72" fill="none" stroke="#2DD4BF" stroke-width="2"/>
  </g>
</g>
</svg>