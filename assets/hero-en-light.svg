<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="augety121 — Reliable Agent Systems">

<defs>
  <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FBFDFF"/>
    <stop offset="0.55" stop-color="#F6FAFF"/>
    <stop offset="1" stop-color="#F0F7FF"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4F7CFF"/>
    <stop offset="0.53" stop-color="#4CB9E9"/>
    <stop offset="1" stop-color="#48C9B0"/>
  </linearGradient>
  <linearGradient id="brandSoft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E9F0FF"/>
    <stop offset="0.55" stop-color="#EAFBFF"/>
    <stop offset="1" stop-color="#ECFBF6"/>
  </linearGradient>
  <radialGradient id="blobBlue"><stop offset="0" stop-color="#BED4FF" stop-opacity=".6"/><stop offset="1" stop-color="#BED4FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="blobCyan"><stop offset="0" stop-color="#C5F0FF" stop-opacity=".55"/><stop offset="1" stop-color="#C5F0FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="blobMint"><stop offset="0" stop-color="#CCF5E9" stop-opacity=".5"/><stop offset="1" stop-color="#CCF5E9" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#466887" flood-opacity=".10"/>
  </filter>
  <filter id="shadowSmall" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#466887" flood-opacity=".08"/>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13px;font-weight:700;letter-spacing:2.2px;fill:#8AA0BB}
    .title{font-size:48px;font-weight:800;letter-spacing:-2px;fill:#10233F}
    .title-en{font-size:50px;font-weight:800;letter-spacing:-1.7px;fill:#10233F}
    .body{font-size:18px;fill:#61738D}
    .body-sm{font-size:14px;fill:#61738D}
    .label{font-size:12px;font-weight:700;fill:#61738D}
    .card-title{font-size:17px;font-weight:760;fill:#10233F}
    .card-sub{font-size:12px;fill:#61738D}
    .micro{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:10px;letter-spacing:1.1px;fill:#8AA0BB}
    .tag{font-size:12px;font-weight:700;fill:#10233F}
  </style>
  
</defs>
<rect x="1" y="1" width="1198" height="438" rx="34" fill="url(#page)" stroke="#DCE8F6"/>
<circle cx="105" cy="42" r="190" fill="url(#blobBlue)" filter="url(#blur)"/>
<circle cx="1098" cy="84" r="210" fill="url(#blobCyan)" filter="url(#blur)"/>
<circle cx="1014" cy="390" r="170" fill="url(#blobMint)" filter="url(#blur)"/>

<!-- slim visual identity rail -->
<rect x="42" y="46" width="7" height="348" rx="4" fill="url(#brand)"/>

<g transform="translate(76 58)">
  <rect x="0" y="0" width="162" height="30" rx="15" fill="#FFFFFF" stroke="#DCE8F6"/>
  <circle cx="18" cy="15" r="5" fill="#48C9B0">
    <animate attributeName="opacity" values="1;.35;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="32" y="20" class="micro" style="font-weight:700">OPEN SOURCE / ACTIVE</text>
</g>

<text x="76" y="132" class="eyebrow">AUGETY121 · AGENT SYSTEMS</text>
<text x="76" y="201" class="title">Reliable Agent Systems</text>
<text x="76" y="241" class="body">Built to be verifiable — not just impressive in a demo.</text>
<text x="76" y="278" class="body">RAG · Context Engineering · MCP · Runtime · Evaluation</text>

<!-- compact capability chips -->
<g transform="translate(76 319)">
  <g><rect x="0" y="0" width="126" height="48" rx="16" fill="#FFFFFF" stroke="#DCE8F6" filter="url(#shadowSmall)"/><circle cx="20" cy="24" r="5" fill="#4F7CFF"/><text x="36" y="29" class="tag">Evidence</text></g>
  <g transform="translate(138 0)"><rect x="0" y="0" width="126" height="48" rx="16" fill="#FFFFFF" stroke="#DCE8F6" filter="url(#shadowSmall)"/><circle cx="20" cy="24" r="5" fill="#4CB9E9"/><text x="36" y="29" class="tag">Context</text></g>
  <g transform="translate(276 0)"><rect x="0" y="0" width="110" height="48" rx="16" fill="#FFFFFF" stroke="#DCE8F6" filter="url(#shadowSmall)"/><circle cx="20" cy="24" r="5" fill="#8D7CF7"/><text x="36" y="29" class="tag">Tools</text></g>
  <g transform="translate(398 0)"><rect x="0" y="0" width="108" height="48" rx="16" fill="#FFFFFF" stroke="#DCE8F6" filter="url(#shadowSmall)"/><circle cx="20" cy="24" r="5" fill="#48C9B0"/><text x="36" y="29" class="tag">State</text></g>
</g>

<!-- runtime canvas -->
<g transform="translate(666 48)">
  <rect x="0" y="0" width="488" height="344" rx="30" fill="#FFFFFF" fill-opacity=".84" stroke="#DCE8F6" filter="url(#shadow)"/>
  <text x="28" y="34" class="micro">RELIABLE AGENT LOOP</text>

  <path id="orbit" d="M113 83 C223 37 340 46 392 133 C440 212 369 285 250 294 C130 303 51 247 57 167 C60 125 79 102 113 83Z" fill="none" stroke="#C5D8F4" stroke-width="2" stroke-dasharray="6 8"/>
  <circle r="5" fill="#4F7CFF"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>

  <!-- flow nodes -->
  <g transform="translate(30 68)"><rect x="0" y="0" width="128" height="62" rx="17" fill="#F3F8FF" stroke="#DCE8F6"/><circle cx="20" cy="20" r="5" fill="#4F7CFF"/><text x="20" y="44" class="card-title">Retrieve</text><text x="20" y="57" class="card-sub">evidence first</text></g>
  <g transform="translate(330 68)"><rect x="0" y="0" width="128" height="62" rx="17" fill="#F3F8FF" stroke="#DCE8F6"/><circle cx="20" cy="20" r="5" fill="#4CB9E9"/><text x="20" y="44" class="card-title">Context</text><text x="20" y="57" class="card-sub">budget + memory</text></g>
  <g transform="translate(330 226)"><rect x="0" y="0" width="128" height="62" rx="17" fill="#F3F8FF" stroke="#DCE8F6"/><circle cx="20" cy="20" r="5" fill="#48C9B0"/><text x="20" y="44" class="card-title">Evaluate</text><text x="20" y="57" class="card-sub">trace + state</text></g>
  <g transform="translate(30 226)"><rect x="0" y="0" width="128" height="62" rx="17" fill="#F3F8FF" stroke="#DCE8F6"/><circle cx="20" cy="20" r="5" fill="#8D7CF7"/><text x="20" y="44" class="card-title">Tools</text><text x="20" y="57" class="card-sub">bounded actions</text></g>

  <g transform="translate(164 121)">
    <rect x="0" y="0" width="160" height="118" rx="28" fill="url(#brand)"/>
    <text x="80" y="45" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;font-size:18px;font-weight:800;fill:#fff">Agent Runtime</text>
    <text x="80" y="69" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;font-size:11px;fill:#fff;opacity:.86">reason · state · recover</text>
    <rect x="46" y="88" width="68" height="5" rx="3" fill="#fff" opacity=".25"/>
    <rect x="46" y="88" width="26" height="5" rx="3" fill="#fff" opacity=".9">
      <animate attributeName="width" values="26;68;26" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</g>

<text x="76" y="404" class="micro">EVIDENCE · CONTEXT · ACTION · STATE · EVALUATION</text>
</svg>
