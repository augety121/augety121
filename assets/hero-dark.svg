<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="augety121 — 构建可靠的 Agent 系统">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0B1020"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B85FF"/><stop offset="0.52" stop-color="#5BD5FF"/><stop offset="1" stop-color="#4BE0C4"/></linearGradient>
  <radialGradient id="glowA"><stop offset="0" stop-color="#4338CA" stop-opacity=".52"/><stop offset="1" stop-color="#4338CA" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB"><stop offset="0" stop-color="#0E7490" stop-opacity=".42"/><stop offset="1" stop-color="#0E7490" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowC"><stop offset="0" stop-color="#0F766E" stop-opacity=".38"/><stop offset="1" stop-color="#0F766E" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".13"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',Arial,sans-serif}
    .eyebrow{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:3px;fill:#9FB0C8}
    .title{font-size:52px;font-weight:760;fill:#EAF1FF;letter-spacing:-1.5px}
    .sub{font-size:18px;fill:#9FB0C8}
    .chip{font-size:13px;font-weight:600;fill:#EAF1FF}
    .node-title{font-size:13px;font-weight:700;fill:#EAF1FF}
    .node-sub{font-size:10px;fill:#9FB0C8}
    .tiny{font-size:10px;fill:#70829B;letter-spacing:1px}
  </style>
</defs>
<rect x="1" y="1" width="1198" height="428" rx="30" fill="url(#bg)" stroke="#24324A"/>
<circle cx="182" cy="48" r="210" fill="url(#glowA)" filter="url(#blur)"/>
<circle cx="1048" cy="70" r="230" fill="url(#glowB)" filter="url(#blur)"/>
<circle cx="1008" cy="392" r="190" fill="url(#glowC)" filter="url(#blur)"/>
<!-- subtle grid -->
<g opacity=".32" stroke="#22314B" stroke-width="1">
  <path d="M0 0V430"/><path d="M60 0V430"/><path d="M120 0V430"/><path d="M180 0V430"/><path d="M240 0V430"/><path d="M300 0V430"/><path d="M360 0V430"/><path d="M420 0V430"/><path d="M480 0V430"/><path d="M540 0V430"/><path d="M600 0V430"/><path d="M660 0V430"/><path d="M720 0V430"/><path d="M780 0V430"/><path d="M840 0V430"/><path d="M900 0V430"/><path d="M960 0V430"/><path d="M1020 0V430"/><path d="M1080 0V430"/><path d="M1140 0V430"/><path d="M1200 0V430"/>
  <path d="M0 0H1200"/><path d="M0 60H1200"/><path d="M0 120H1200"/><path d="M0 180H1200"/><path d="M0 240H1200"/><path d="M0 300H1200"/><path d="M0 360H1200"/><path d="M0 420H1200"/>
</g>
<rect x="58" y="54" width="118" height="30" rx="15" fill="#141B34" stroke="#343A70"/>
<circle cx="79" cy="69" r="5" fill="#4BE0C4"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="93" y="74" class="tiny" style="font-weight:700">BUILDING</text>
<text x="58" y="126" class="eyebrow">AUGETY121 / AGENT SYSTEMS</text>
<text x="58" y="191" class="title">构建可靠的 Agent 系统</text>
<text x="58" y="232" class="sub">RAG · Context Engineering · MCP · Evaluation · Runtime</text>
<text x="58" y="268" class="sub">让检索有证据，让工具有边界，让状态可追踪，让评测可复现。</text>
<g transform="translate(58 304)">
  <g><rect width="120" height="34" rx="17" fill="#141B34" stroke="#343A70"/><text x="60" y="22" text-anchor="middle" class="chip">RAG Agent</text></g>
  <g transform="translate(132)"><rect width="164" height="34" rx="17" fill="#141B34" stroke="#343A70"/><text x="82" y="22" text-anchor="middle" class="chip">Context Engineering</text></g>
  <g transform="translate(308)"><rect width="86" height="34" rx="17" fill="#141B34" stroke="#343A70"/><text x="43" y="22" text-anchor="middle" class="chip">MCP</text></g>
  <g transform="translate(406)"><rect width="126" height="34" rx="17" fill="#141B34" stroke="#343A70"/><text x="63" y="22" text-anchor="middle" class="chip">Evaluation</text></g>
</g>
<!-- system constellation -->
<g transform="translate(698 58)">
  <rect x="0" y="0" width="444" height="314" rx="28" fill="#0F172A" fill-opacity=".88" stroke="#24324A"/>
  <text x="28" y="34" class="tiny">RELIABLE AGENT LOOP</text>
  <path id="p1" d="M88 88 C160 48 220 48 286 88" fill="none" stroke="#8B85FF" stroke-width="2" opacity=".48"/>
  <path id="p2" d="M304 106 C342 154 342 196 304 238" fill="none" stroke="#5BD5FF" stroke-width="2" opacity=".48"/>
  <path id="p3" d="M284 256 C214 288 154 288 90 250" fill="none" stroke="#4BE0C4" stroke-width="2" opacity=".48"/>
  <path id="p4" d="M72 232 C42 187 42 148 72 106" fill="none" stroke="#A78BFA" stroke-width="2" opacity=".48"/>
  <circle r="4" fill="#8B85FF"><animateMotion dur="4.8s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle r="4" fill="#5BD5FF"><animateMotion dur="4.2s" begin=".7s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <circle r="4" fill="#4BE0C4"><animateMotion dur="5.1s" begin="1.2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <circle r="4" fill="#A78BFA"><animateMotion dur="4.5s" begin=".3s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
  <g transform="translate(44 65)"><rect width="118" height="58" rx="16" fill="#111B30" stroke="#24324A"/><text x="59" y="25" text-anchor="middle" class="node-title">Retrieve</text><text x="59" y="43" text-anchor="middle" class="node-sub">evidence first</text></g>
  <g transform="translate(276 65)"><rect width="124" height="58" rx="16" fill="#111B30" stroke="#24324A"/><text x="62" y="25" text-anchor="middle" class="node-title">Context</text><text x="62" y="43" text-anchor="middle" class="node-sub">budget + memory</text></g>
  <g transform="translate(278 221)"><rect width="122" height="58" rx="16" fill="#111B30" stroke="#24324A"/><text x="61" y="25" text-anchor="middle" class="node-title">Evaluate</text><text x="61" y="43" text-anchor="middle" class="node-sub">trace + state</text></g>
  <g transform="translate(44 221)"><rect width="118" height="58" rx="16" fill="#111B30" stroke="#24324A"/><text x="59" y="25" text-anchor="middle" class="node-title">Tools</text><text x="59" y="43" text-anchor="middle" class="node-sub">bounded actions</text></g>
  <g transform="translate(154 126)"><rect width="140" height="92" rx="24" fill="url(#brand)"/><text x="70" y="38" text-anchor="middle" style="font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Agent Runtime</text><text x="70" y="61" text-anchor="middle" style="font:500 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff;opacity:.86">reason · state · recover</text><circle cx="70" cy="76" r="3" fill="#fff" opacity=".82"><animate attributeName="r" values="3;5;3" dur="2.6s" repeatCount="indefinite"/></circle></g>
</g>
<text x="58" y="398" class="tiny">EVIDENCE → CONTEXT → ACTION → STATE → EVALUATION</text>
</svg>