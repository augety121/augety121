"634" y="122" class="micro" text-anchor="end">SELECT</text><path d="M652 138 H660" stroke="#AFC4DA" stroke-width="2.2" stroke-linecap="round"/><path d="M657 134 L662 138 L657 142" fill="none" stroke="#AFC4DA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="662" y="92" width="146" height="92" rx="22" fill="#FFFFFF" stroke="#DCE8F6" filter="url(#shadowSmall)"/><rect x="678" y="108" width="34" height="34" rx="11" fill="#DCE9FF"/><circle cx="695" cy="125" r="6" fill="#4F7CFF"/><text x="678" y="164" class="card-title">Runtime</text><text x="792" y="122" class="micro" text-anchor="end">REASON</text><path d="M810 138 H818" stroke="#AFC4DA" stroke-width="2.2" stroke-linecap="round"/><path d="M815 134 L820 138 L815 142" fill="none" stroke="#AFC4DA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="820" y="92" width="146" height="92" rx="22" fill="#FFFFFF" stroke="#DCE8F6" filter="url(#shadowSmall)"/><rect x="836" y="108" width="34" height="34" rx="11" fill="#DDF8F1"/><circle cx="853" cy="125" r="6" fill="#48C9B0"/><text x="836" y="164" class="card-title">Tools</text><text x="950" y="122" class="micro" text-anchor="end">ACT</text><path d="M968 138 H976" stroke="#AFC4DA" stroke-width="2.2" stroke-linecap="round"/><path d="M973 134 L978 138 L973 142" fill="none" stroke="#AFC4DA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="978" y="92" width="146" height="92" rx="22" fill="#FFFFFF" stroke="#DCE8F6" filter="url(#shadowSmall)"/><rect x="994" y="108" width="34" height="34" rx="11" fill="#DCF6FF"/><circle cx="1011" cy="125" r="6" fill="#4CB9E9"/><text x="994" y="164" class="card-title">Evaluate</text><text x="1108" y="122" class="micro" text-anchor="end">VERIFY</text>
<text x="30" y="222" class="micro">WHY THIS CONTEXT? · WHAT CHANGED? · HOW DO WE VERIFY IT?</text>
</svg>
