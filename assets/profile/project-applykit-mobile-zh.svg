<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-label="ApplyKit · 把投递材料整理得刚刚好">
<title>ApplyKit · 把投递材料整理得刚刚好</title>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F6FBFF"/><stop offset=".55" stop-color="#F3FAFB"/><stop offset="1" stop-color="#EBF8F0"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#69AFDD"/><stop offset="1" stop-color="#68C4AC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#A9D9EF" stop-opacity=".38"/><stop offset="1" stop-color="#A9D9EF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A3BCC8" opacity=".23"/></pattern>
  <clipPath id="clip"><rect x="1" y="1" width="718" height="308" rx="28"/></clipPath>
  <style>text{font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}.flow{stroke-dasharray:14 180}.flow-slow{stroke-dasharray:10 240}
      .flow{stroke-dasharray:14 180;animation:flow 7s linear infinite}
      .flow-slow{stroke-dasharray:10 240;animation:flowSlow 11s linear infinite reverse}
      .float{animation:float 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .breathe{animation:breathe 5s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-776}}
      @keyframes flowSlow{to{stroke-dashoffset:-1000}}
      @keyframes float{50%{transform:translateY(-9px)}}
      @keyframes breathe{50%{opacity:.45}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
</defs>
<g clip-path="url(#clip)"><rect width="720" height="310" fill="url(#paper)"/><g class="project-flow" opacity=".75"><path d="M-20 295 C115 251 210 320 350 283 S570 264 740 283" fill="none" stroke="#78B8D9" stroke-width="16" opacity=".09"/><path d="M-20 295 C115 251 210 320 350 283 S570 264 740 283" fill="none" stroke="#78B8D9" stroke-width="1.2" opacity=".5"/><path class="flow" d="M-20 295 C115 251 210 320 350 283 S570 264 740 283" fill="none" stroke="#78B8D9" stroke-width="3" stroke-linecap="round"/><path d="M-20 313 C170 260 224 338 382 301 S571 279 740 303" fill="none" stroke="#72BEAA" stroke-width="16" opacity=".09"/><path d="M-20 313 C170 260 224 338 382 301 S571 279 740 303" fill="none" stroke="#72BEAA" stroke-width="1.2" opacity=".5"/><path class="flow-slow" d="M-20 313 C170 260 224 338 382 301 S571 279 740 303" fill="none" stroke="#72BEAA" stroke-width="3" stroke-linecap="round"/></g><text x="36" y="43" font-size="26" fill="#309F8B" font-weight="600" letter-spacing="1">桌面工具</text><text x="36" y="105" font-size="44" fill="#243B53" font-weight="700" >ApplyKit</text><text x="36" y="154" font-size="29" fill="#526F7B" font-weight="400" >把投递材料整理得刚刚好</text><text x="36" y="206" font-size="28" fill="#397565" font-weight="500" >Windows</text><text x="36" y="243" font-size="28" fill="#397565" font-weight="500" >本地处理 · PDF 与图片</text></g>
<rect x="1" y="1" width="718" height="308" rx="28" fill="none" stroke="#DDEBEA"/>
</svg>
