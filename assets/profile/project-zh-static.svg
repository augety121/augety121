<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="235" viewBox="0 0 1200 235" role="img" aria-label="MCP State Twin · 开发预览">
<title>MCP State Twin · 开发预览</title>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F6FBFF"/><stop offset=".55" stop-color="#F3FAFB"/><stop offset="1" stop-color="#EBF8F0"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#69AFDD"/><stop offset="1" stop-color="#68C4AC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#A9D9EF" stop-opacity=".38"/><stop offset="1" stop-color="#A9D9EF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A3BCC8" opacity=".23"/></pattern>
  <clipPath id="clip"><rect x="1" y="1" width="1198" height="233" rx="28"/></clipPath>
  <style>text{font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}.flow{stroke-dasharray:14 180}.flow-slow{stroke-dasharray:10 240}</style>
</defs>
<g clip-path="url(#clip)"><rect width="1200" height="235" fill="url(#paper)"/><text x="44" y="43" font-size="14" fill="#607D8B" font-weight="600" letter-spacing="2">正在探索 / 精选开源</text><text x="44" y="99" font-size="39" fill="#243B53" font-weight="700" >MCP State Twin</text><text x="44" y="140" font-size="20" fill="#607D8B" font-weight="400" >同一起点，不同路径，可比较的最终状态。</text><rect x="44" y="168" width="110" height="29" rx="14" fill="#DCEFE8"/><text x="99" y="188" font-size="13" fill="#397565" font-weight="600" text-anchor="middle">开发预览</text><text x="174" y="188" font-size="15" fill="#607D8B" font-weight="400" >Go · MCP · 评测环境</text><path d="M766 121 C797 121 795 74 826 74 M960 74 C1005 74 1006 127 1050 127" fill="none" stroke="#C7E0E4" stroke-width="2"/><path class="flow" d="M766 121 C797 121 795 74 826 74 M960 74 C1005 74 1006 127 1050 127" fill="none" stroke="#438BC5" stroke-width="3" stroke-linecap="round"/><path d="M766 121 C797 121 795 190 826 190 M960 190 C1005 190 1006 127 1050 127" fill="none" stroke="#C7E0E4" stroke-width="2"/><path class="flow" d="M766 121 C797 121 795 190 826 190 M960 190 C1005 190 1006 127 1050 127" fill="none" stroke="#309F8B" stroke-width="3" stroke-linecap="round"/><rect x="656" y="90" width="110" height="54" rx="17" fill="#FFFFFF" stroke="#D5E6E9"/><text x="711.0" y="124" font-size="17" fill="#438BC5" font-weight="600" text-anchor="middle">快照</text><rect x="826" y="47" width="134" height="54" rx="17" fill="#FFFFFF" stroke="#D5E6E9"/><text x="893.0" y="81" font-size="17" fill="#438BC5" font-weight="600" text-anchor="middle">运行 A</text><rect x="826" y="163" width="134" height="54" rx="17" fill="#FFFFFF" stroke="#D5E6E9"/><text x="893.0" y="197" font-size="17" fill="#309F8B" font-weight="600" text-anchor="middle">运行 B</text><rect x="1050" y="100" width="104" height="54" rx="17" fill="#FFFFFF" stroke="#D5E6E9"/><text x="1102.0" y="134" font-size="17" fill="#309F8B" font-weight="600" text-anchor="middle">比较终态</text><text x="711" y="175" font-size="14" fill="#607D8B" font-weight="400" text-anchor="middle">相同起点</text></g>
<rect x="1" y="1" width="1198" height="233" rx="28" fill="none" stroke="#DDEBEA"/>
</svg>
