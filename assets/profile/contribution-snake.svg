<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="贡献日历尚未更新 / Contribution calendar pending">
<title>贡献日历尚未更新 / Contribution calendar pending</title>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F6FBFF"/><stop offset=".55" stop-color="#F3FAFB"/><stop offset="1" stop-color="#EBF8F0"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#69AFDD"/><stop offset="1" stop-color="#68C4AC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#A9D9EF" stop-opacity=".38"/><stop offset="1" stop-color="#A9D9EF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A3BCC8" opacity=".23"/></pattern>
  <clipPath id="clip"><rect x="1" y="1" width="1198" height="198" rx="28"/></clipPath>
  <style>text{font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}</style>
</defs>
<g clip-path="url(#clip)"><rect width="1200" height="200" fill="url(#paper)"/><text x="36" y="36" font-size="16" fill="#607D8B" font-weight="600" >贡献日历 / Contributions</text><text x="600" y="115" font-size="23" fill="#607D8B" font-weight="400" text-anchor="middle">等待首次更新 / Awaiting first update</text></g>
<rect x="1" y="1" width="1198" height="198" rx="28" fill="none" stroke="#DDEBEA"/>
</svg>
