<svg xmlns="http://www.w3.org/2000/svg" width="720" height="205" viewBox="0 0 720 205" role="img" aria-label="ApplyKit · Application documents, ready to go">
<title>ApplyKit · Application documents, ready to go</title>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F6FBFF"/><stop offset=".55" stop-color="#F3FAFB"/><stop offset="1" stop-color="#EBF8F0"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#69AFDD"/><stop offset="1" stop-color="#68C4AC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#A9D9EF" stop-opacity=".38"/><stop offset="1" stop-color="#A9D9EF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A3BCC8" opacity=".23"/></pattern>
  <clipPath id="clip"><rect x="1" y="1" width="718" height="203" rx="28"/></clipPath>
  <style>text{font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}.flow{stroke-dasharray:14 180}.flow-slow{stroke-dasharray:10 240}
      .flow{stroke-dasharray:14 180;animation:flow 7s linear infinite}
      .flow-slow{stroke-dasharray:10 240;animation:flowSlow 11s linear infinite reverse}
      .float{animation:float 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .breathe{animation:breathe 5s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-776}}
      @keyframes flowSlow{to{stroke-dashoffset:-1000}}
      @keyframes float{50%{transform:translateY(-9px)}}
      @keyframes breathe{50%{opacity:.45}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
</defs>
<g clip-path="url(#clip)"><rect width="720" height="205" fill="url(#paper)"/><rect x="36" y="32" width="30" height="4" rx="2" fill="url(#accent)"/><text x="36" y="87" font-size="40" fill="#243B53" font-weight="700" >ApplyKit</text><text x="36" y="132" font-size="26" fill="#607D8B" font-weight="400" >Application documents, ready to go</text><text x="36" y="176" font-size="22" fill="#309F8B" font-weight="500" >Windows · Local processing · PDF &amp; images</text></g>
<rect x="1" y="1" width="718" height="203" rx="28" fill="none" stroke="#DDEBEA"/>
</svg>
