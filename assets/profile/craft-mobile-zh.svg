<svg xmlns="http://www.w3.org/2000/svg" width="720" height="694" viewBox="0 0 720 694" role="img" aria-label="让每一步，都有依据">
<title>让每一步，都有依据</title>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F6FBFF"/><stop offset=".55" stop-color="#F3FAFB"/><stop offset="1" stop-color="#EBF8F0"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#69AFDD"/><stop offset="1" stop-color="#68C4AC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#A9D9EF" stop-opacity=".38"/><stop offset="1" stop-color="#A9D9EF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A3BCC8" opacity=".23"/></pattern>
  <clipPath id="clip"><rect x="1" y="1" width="718" height="692" rx="28"/></clipPath>
  <style>text{font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}.flow{stroke-dasharray:14 180}.flow-slow{stroke-dasharray:10 240}
      .flow{stroke-dasharray:14 180;animation:flow 7s linear infinite}
      .flow-slow{stroke-dasharray:10 240;animation:flowSlow 11s linear infinite reverse}
      .float{animation:float 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .breathe{animation:breathe 5s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-776}}
      @keyframes flowSlow{to{stroke-dashoffset:-1000}}
      @keyframes float{50%{transform:translateY(-9px)}}
      @keyframes breathe{50%{opacity:.45}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
</defs>
<g clip-path="url(#clip)"><rect width="720" height="694" fill="url(#paper)"/><text x="36" y="44" font-size="30" fill="#243B53" font-weight="600" >让每一步，都有依据</text><path d="M360 196 V224 M360 340 V368 M360 484 V512 M48 570 H22 V138 H48" fill="none" stroke="#C2DFE3" stroke-width="2"/><path class="flow" d="M360 196 V224 M360 340 V368 M360 484 V512 M48 570 H22 V138 H48" fill="none" stroke="#59AAA9" stroke-width="3"/><path class="craft-arrow" d="M355 206 L360 214 L365 206" fill="none" stroke="#69AAA9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="craft-arrow" d="M355 350 L360 358 L365 350" fill="none" stroke="#69AAA9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="craft-arrow" d="M355 494 L360 502 L365 494" fill="none" stroke="#69AAA9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="craft-arrow" d="M34 133 L42 138 L34 143" fill="none" stroke="#69AAA9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect class="craft-step" x="48" y="80" width="624" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="70" y="104" width="4" height="25" rx="2" fill="#438BC5"/><text x="88" y="125" font-size="36" fill="#243B53" font-weight="600" >拆解问题</text><text x="88" y="166" font-size="28" fill="#607D8B" font-weight="400" >明确目标与边界</text><rect class="craft-step" x="48" y="224" width="624" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="70" y="248" width="4" height="25" rx="2" fill="#438BC5"/><text x="88" y="269" font-size="36" fill="#243B53" font-weight="600" >小步实现</text><text x="88" y="310" font-size="28" fill="#607D8B" font-weight="400" >做出最小完整闭环</text><rect class="craft-step" x="48" y="368" width="624" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="70" y="392" width="4" height="25" rx="2" fill="#309F8B"/><text x="88" y="413" font-size="36" fill="#243B53" font-weight="600" >证据验证</text><text x="88" y="454" font-size="28" fill="#607D8B" font-weight="400" >用测试与轨迹检查结果</text><rect class="craft-step" x="48" y="512" width="624" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="70" y="536" width="4" height="25" rx="2" fill="#309F8B"/><text x="88" y="557" font-size="36" fill="#243B53" font-weight="600" >复盘迭代</text><text x="88" y="598" font-size="28" fill="#607D8B" font-weight="400" >把经验沉淀为下一步</text><text x="360.0" y="675" font-size="26" fill="#607D8B" font-weight="400" text-anchor="middle">保持反馈，让每次迭代都有依据。</text></g>
<rect x="1" y="1" width="718" height="692" rx="28" fill="none" stroke="#DDEBEA"/>
</svg>
