<svg xmlns="http://www.w3.org/2000/svg" width="720" height="205" viewBox="0 0 720 205" role="img" aria-label="简历填写助手 · 资料在本地，填写前先核对">
<title>简历填写助手 · 资料在本地，填写前先核对</title>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F6FBFF"/><stop offset=".55" stop-color="#F3FAFB"/><stop offset="1" stop-color="#EBF8F0"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#69AFDD"/><stop offset="1" stop-color="#68C4AC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#A9D9EF" stop-opacity=".38"/><stop offset="1" stop-color="#A9D9EF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A3BCC8" opacity=".23"/></pattern>
  <clipPath id="clip"><rect x="1" y="1" width="718" height="203" rx="28"/></clipPath>
  <style>text{font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}.flow{stroke-dasharray:14 180}.flow-slow{stroke-dasharray:10 240}</style>
</defs>
<g clip-path="url(#clip)"><rect width="720" height="205" fill="url(#paper)"/><rect x="36" y="32" width="30" height="4" rx="2" fill="url(#accent)"/><text x="36" y="87" font-size="40" fill="#243B53" font-weight="700" >简历填写助手</text><text x="36" y="132" font-size="26" fill="#607D8B" font-weight="400" >资料在本地，填写前先核对</text><text x="36" y="176" font-size="22" fill="#309F8B" font-weight="500" >Chrome / Edge · 本地优先 · 可选 MCP</text></g>
<rect x="1" y="1" width="718" height="203" rx="28" fill="none" stroke="#DDEBEA"/>
</svg>
