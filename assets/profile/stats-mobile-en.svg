<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="GitHub activity">
<title>GitHub activity</title>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F6FBFF"/><stop offset=".55" stop-color="#F3FAFB"/><stop offset="1" stop-color="#EBF8F0"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#69AFDD"/><stop offset="1" stop-color="#68C4AC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#A9D9EF" stop-opacity=".38"/><stop offset="1" stop-color="#A9D9EF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A3BCC8" opacity=".23"/></pattern>
  <clipPath id="clip"><rect x="1" y="1" width="718" height="352" rx="28"/></clipPath>
  <style>text{font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}.flow{stroke-dasharray:14 180}.flow-slow{stroke-dasharray:10 240}</style>
</defs>
<g clip-path="url(#clip)"><rect width="720" height="354" fill="url(#paper)"/><text x="36" y="42" font-size="26" fill="#607D8B" font-weight="600" >SMALL STEPS / GITHUB ACTIVITY</text><text x="36" y="111" font-size="52" fill="#438BC5" font-weight="650" >6</text><text x="36" y="149" font-size="26" fill="#607D8B" font-weight="400" >Public non-fork repos</text><text x="386" y="111" font-size="52" fill="#309F8B" font-weight="650" >53</text><text x="386" y="149" font-size="26" fill="#607D8B" font-weight="400" >Stars received</text><text x="36" y="235" font-size="52" fill="#438BC5" font-weight="650" >2,039</text><text x="36" y="273" font-size="26" fill="#607D8B" font-weight="400" >Contributions / year</text><text x="386" y="235" font-size="52" fill="#309F8B" font-weight="650" >11</text><text x="386" y="273" font-size="26" fill="#607D8B" font-weight="400" >Followers</text><text x="36" y="328" font-size="24" fill="#607D8B" font-weight="400" >Updated 2026-10-26 12:53 UTC+8</text></g>
<rect x="1" y="1" width="718" height="352" rx="28" fill="none" stroke="#DDEBEA"/>
</svg>
