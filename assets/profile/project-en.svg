<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="235" viewBox="0 0 1200 235" role="img" aria-label="MCP State Twin · Development preview">
<title>MCP State Twin · Development preview</title>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F6FBFF"/><stop offset=".55" stop-color="#F3FAFB"/><stop offset="1" stop-color="#EBF8F0"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#69AFDD"/><stop offset="1" stop-color="#68C4AC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#A9D9EF" stop-opacity=".38"/><stop offset="1" stop-color="#A9D9EF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A3BCC8" opacity=".23"/></pattern>
  <clipPath id="clip"><rect x="1" y="1" width="1198" height="233" rx="28"/></clipPath>
  <style>text{font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}.flow{stroke-dasharray:14 180}.flow-slow{stroke-dasharray:10 240}
      .flow{stroke-dasharray:14 180;animation:flow 7s linear infinite}
      .flow-slow{stroke-dasharray:10 240;animation:flowSlow 11s linear infinite reverse}
      .float{animation:float 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .breathe{animation:breathe 5s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-776}}
      @keyframes flowSlow{to{stroke-dashoffset:-1000}}
      @keyframes float{50%{transform:translateY(-9px)}}
      @keyframes breathe{50%{opacity:.45}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
</defs>
<g clip-path="url(#clip)"><rect width="1200" height="235" fill="url(#paper)"/><text x="44" y="43" font-size="14" fill="#607D8B" font-weight="600" letter-spacing="2">IN FOCUS / OPEN SOURCE</text><text x="44" y="99" font-size="39" fill="#243B53" font-weight="700" >MCP State Twin</text><text x="44" y="140" font-size="17" fill="#607D8B" font-weight="400" >Same start. Different paths. Comparable outcomes.</text><rect x="44" y="168" width="110" height="29" rx="14" fill="#DCEFE8"/><text x="99" y="188" font-size="13" fill="#397565" font-weight="600" text-anchor="middle">PREVIEW</text><text x="174" y="188" font-size="15" fill="#607D8B" font-weight="400" >Go · MCP · Evaluation</text><path d="M700 116 C786 116 762 64 839 64 H1119 M700 116 C786 116 762 174 839 174 H1119" fill="none" stroke="#CBDFE5" stroke-width="2"/><path class="flow" d="M700 116 C786 116 762 64 839 64 H1119" fill="none" stroke="#4A94C8" stroke-width="4" stroke-linecap="round"/><path class="flow-slow" d="M700 116 C786 116 762 174 839 174 H1119" fill="none" stroke="#4CAC96" stroke-width="4" stroke-linecap="round"/><circle cx="693" cy="116" r="27" fill="#FFFFFF" stroke="#D5E6E9"/><circle class="breathe" cx="693" cy="116" r="8" fill="#438BC5"/><text x="733" y="122" font-size="16" fill="#243B53" font-weight="500" >Snapshot</text><circle cx="894" cy="64" r="27" fill="#FFFFFF" stroke="#D5E6E9"/><circle class="breathe" cx="894" cy="64" r="8" fill="#438BC5"/><text x="934" y="70" font-size="16" fill="#243B53" font-weight="500" >Run A</text><circle cx="894" cy="174" r="27" fill="#FFFFFF" stroke="#D5E6E9"/><circle class="breathe" cx="894" cy="174" r="8" fill="#309F8B"/><text x="934" y="180" font-size="16" fill="#243B53" font-weight="500" >Run B</text><text x="1127" y="122" font-size="15" fill="#607D8B" font-weight="500" text-anchor="middle">Diff</text></g>
<rect x="1" y="1" width="1198" height="233" rx="28" fill="none" stroke="#DDEBEA"/>
</svg>
