<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Turn questions into verifiable progress">
<title>Turn questions into verifiable progress</title>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F6FBFF"/><stop offset=".55" stop-color="#F3FAFB"/><stop offset="1" stop-color="#EBF8F0"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#69AFDD"/><stop offset="1" stop-color="#68C4AC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#A9D9EF" stop-opacity=".38"/><stop offset="1" stop-color="#A9D9EF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A3BCC8" opacity=".23"/></pattern>
  <clipPath id="clip"><rect x="1" y="1" width="1198" height="258" rx="28"/></clipPath>
  <style>text{font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}.flow{stroke-dasharray:14 180}.flow-slow{stroke-dasharray:10 240}
      .flow{stroke-dasharray:14 180;animation:flow 7s linear infinite}
      .flow-slow{stroke-dasharray:10 240;animation:flowSlow 11s linear infinite reverse}
      .float{animation:float 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .breathe{animation:breathe 5s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-776}}
      @keyframes flowSlow{to{stroke-dashoffset:-1000}}
      @keyframes float{50%{transform:translateY(-9px)}}
      @keyframes breathe{50%{opacity:.45}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
</defs>
<g clip-path="url(#clip)"><rect width="1200" height="260" fill="url(#paper)"/><text x="36" y="44" font-size="26" fill="#243B53" font-weight="600" >Turn questions into verifiable progress</text><path d="M300 141 H324 M588 141 H612 M876 141 H900 M1032 199 V221 H168 V199" fill="none" stroke="#C2DFE3" stroke-width="2"/><path class="flow" d="M300 141 H324 M588 141 H612 M876 141 H900 M1032 199 V221 H168 V199" fill="none" stroke="#59AAA9" stroke-width="3"/><path class="craft-arrow" d="M307 136 L315 141 L307 146" fill="none" stroke="#69AAA9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="craft-arrow" d="M595 136 L603 141 L595 146" fill="none" stroke="#69AAA9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="craft-arrow" d="M883 136 L891 141 L883 146" fill="none" stroke="#69AAA9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="craft-arrow" d="M614 216 L606 221 L614 226" fill="none" stroke="#69AAA9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="83" width="264" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="58" y="107" width="4" height="25" rx="2" fill="#438BC5"/><text x="76" y="128" font-size="24" fill="#243B53" font-weight="600" >Define</text><text x="58" y="169" font-size="17" fill="#607D8B" font-weight="400" >Goals and boundaries</text><rect x="324" y="83" width="264" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="346" y="107" width="4" height="25" rx="2" fill="#438BC5"/><text x="364" y="128" font-size="24" fill="#243B53" font-weight="600" >Build</text><text x="346" y="169" font-size="17" fill="#607D8B" font-weight="400" >A small, complete loop</text><rect x="612" y="83" width="264" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="634" y="107" width="4" height="25" rx="2" fill="#309F8B"/><text x="652" y="128" font-size="24" fill="#243B53" font-weight="600" >Verify</text><text x="634" y="169" font-size="17" fill="#607D8B" font-weight="400" >Tests, traces and results</text><rect x="900" y="83" width="264" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="922" y="107" width="4" height="25" rx="2" fill="#309F8B"/><text x="940" y="128" font-size="24" fill="#243B53" font-weight="600" >Iterate</text><text x="922" y="169" font-size="17" fill="#607D8B" font-weight="400" >Learn and improve</text><text x="600.0" y="241" font-size="15" fill="#607D8B" font-weight="400" text-anchor="middle">Keep the feedback loop open.</text></g>
<rect x="1" y="1" width="1198" height="258" rx="28" fill="none" stroke="#DDEBEA"/>
</svg>
