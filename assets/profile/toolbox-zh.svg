<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="292" viewBox="0 0 1200 292" role="img" aria-label="技术栈">
<title>技术栈</title>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F6FBFF"/><stop offset=".55" stop-color="#F3FAFB"/><stop offset="1" stop-color="#EBF8F0"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#69AFDD"/><stop offset="1" stop-color="#68C4AC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#A9D9EF" stop-opacity=".38"/><stop offset="1" stop-color="#A9D9EF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A3BCC8" opacity=".23"/></pattern>
  <clipPath id="clip"><rect x="1" y="1" width="1198" height="290" rx="28"/></clipPath>
  <style>text{font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}.flow{stroke-dasharray:14 180}.flow-slow{stroke-dasharray:10 240}
      .flow{stroke-dasharray:14 180;animation:flow 7s linear infinite}
      .flow-slow{stroke-dasharray:10 240;animation:flowSlow 11s linear infinite reverse}
      .float{animation:float 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .breathe{animation:breathe 5s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-776}}
      @keyframes flowSlow{to{stroke-dashoffset:-1000}}
      @keyframes float{50%{transform:translateY(-9px)}}
      @keyframes breathe{50%{opacity:.45}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
</defs>
<g clip-path="url(#clip)"><rect width="1200" height="292" fill="none"/><rect x="1" y="1" width="584" height="290" rx="26" fill="#F4FAFE" stroke="#DDEBEA"/><rect x="31" y="30" width="4" height="30" rx="2" fill="#438BC5"/><text x="52" y="56" font-size="30" fill="#243B53" font-weight="600" >编程语言</text><rect class="tool-chip" x="31" y="86" width="120" height="54" rx="16" fill="#FFFFFF" fill-opacity=".88" stroke="#DCEAE9"/><text x="91.0" y="122" font-size="25" fill="#3D596C" font-weight="500" text-anchor="middle">Python</text><rect class="tool-chip" x="165" y="86" width="176" height="54" rx="16" fill="#FFFFFF" fill-opacity=".88" stroke="#DCEAE9"/><text x="253.0" y="122" font-size="25" fill="#3D596C" font-weight="500" text-anchor="middle">TypeScript</text><rect class="tool-chip" x="31" y="158" width="64" height="54" rx="16" fill="#FFFFFF" fill-opacity=".88" stroke="#DCEAE9"/><text x="63.0" y="194" font-size="25" fill="#3D596C" font-weight="500" text-anchor="middle">Go</text><rect class="tool-chip" x="109" y="158" width="120" height="54" rx="16" fill="#FFFFFF" fill-opacity=".88" stroke="#DCEAE9"/><text x="169.0" y="194" font-size="25" fill="#3D596C" font-weight="500" text-anchor="middle">Kotlin</text><path d="M31 262 H555" stroke="#DCEAE9"/><path class="flow-slow" d="M31 262 H555" stroke="#438BC5" stroke-width="2"/><rect x="615" y="1" width="584" height="290" rx="26" fill="#F0F9F5" stroke="#DDEBEA"/><rect x="645" y="30" width="4" height="30" rx="2" fill="#309F8B"/><text x="666" y="56" font-size="30" fill="#243B53" font-weight="600" >工程工具</text><rect class="tool-chip" x="645" y="86" width="120" height="54" rx="16" fill="#FFFFFF" fill-opacity=".88" stroke="#DCEAE9"/><text x="705.0" y="122" font-size="25" fill="#3D596C" font-weight="500" text-anchor="middle">Docker</text><rect class="tool-chip" x="779" y="86" width="176" height="54" rx="16" fill="#FFFFFF" fill-opacity=".88" stroke="#DCEAE9"/><text x="867.0" y="122" font-size="25" fill="#3D596C" font-weight="500" text-anchor="middle">PostgreSQL</text><rect class="tool-chip" x="969" y="86" width="106" height="54" rx="16" fill="#FFFFFF" fill-opacity=".88" stroke="#DCEAE9"/><text x="1022.0" y="122" font-size="25" fill="#3D596C" font-weight="500" text-anchor="middle">Redis</text><rect class="tool-chip" x="645" y="158" width="78" height="54" rx="16" fill="#FFFFFF" fill-opacity=".88" stroke="#DCEAE9"/><text x="684.0" y="194" font-size="25" fill="#3D596C" font-weight="500" text-anchor="middle">Git</text><rect class="tool-chip" x="737" y="158" width="232" height="54" rx="16" fill="#FFFFFF" fill-opacity=".88" stroke="#DCEAE9"/><text x="853.0" y="194" font-size="25" fill="#3D596C" font-weight="500" text-anchor="middle">GitHub Actions</text><path d="M645 262 H1169" stroke="#DCEAE9"/><path class="flow-slow" d="M645 262 H1169" stroke="#309F8B" stroke-width="2"/></g>
<rect x="1" y="1" width="1198" height="290" rx="28" fill="none" stroke="none"/>
</svg>
