<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="189" viewBox="0 0 1200 189" role="img" aria-label="Engineering focus">
<title>Engineering focus</title>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F6FBFF"/><stop offset=".55" stop-color="#F3FAFB"/><stop offset="1" stop-color="#EBF8F0"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#69AFDD"/><stop offset="1" stop-color="#68C4AC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#A9D9EF" stop-opacity=".38"/><stop offset="1" stop-color="#A9D9EF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A3BCC8" opacity=".23"/></pattern>
  <clipPath id="clip"><rect x="1" y="1" width="1198" height="187" rx="28"/></clipPath>
  <style>text{font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}.flow{stroke-dasharray:14 180}.flow-slow{stroke-dasharray:10 240}
      .flow{stroke-dasharray:14 180;animation:flow 7s linear infinite}
      .flow-slow{stroke-dasharray:10 240;animation:flowSlow 11s linear infinite reverse}
      .float{animation:float 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .breathe{animation:breathe 5s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-776}}
      @keyframes flowSlow{to{stroke-dashoffset:-1000}}
      @keyframes float{50%{transform:translateY(-9px)}}
      @keyframes breathe{50%{opacity:.45}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
</defs>
<g clip-path="url(#clip)"><rect width="1200" height="189" fill="none"/><rect x="1" y="1" width="382" height="187" rx="22" fill="#F4FAFE" stroke="#DDEBEA"/><g transform="translate(27 27)" stroke="#438BC5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0 H24 V28 H0 Z M6 8 H18 M6 14 H18 M6 20 H14"/></g><text x="76" y="49" font-size="29" fill="#243B53" font-weight="600" >Context</text><text x="27" y="106" font-size="20" fill="#607D8B" font-weight="400" >Retrieval · Reranking · Graphs</text><text x="27" y="151" font-size="19" fill="#607D8B" font-weight="400" >Bring useful evidence into context</text><path d="M27 171 H357" stroke="#DCEAE9"/><path class="flow-slow" d="M27 171 H357" stroke="#438BC5" stroke-width="2"/><rect x="409" y="1" width="382" height="187" rx="22" fill="#F3FAFB" stroke="#DDEBEA"/><g transform="translate(435 27)" stroke="#309F8B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0 5 H28 M0 15 H28 M0 25 H28"/><circle cx="8" cy="5" r="3" fill="#F3FAFB"/><circle cx="20" cy="15" r="3" fill="#F3FAFB"/><circle cx="10" cy="25" r="3" fill="#F3FAFB"/></g><text x="484" y="49" font-size="29" fill="#243B53" font-weight="600" >Runtime</text><text x="435" y="106" font-size="20" fill="#607D8B" font-weight="400" >MCP · State · Recovery</text><text x="435" y="151" font-size="19" fill="#607D8B" font-weight="400" >Give each action clear boundaries</text><path d="M435 171 H765" stroke="#DCEAE9"/><path class="flow-slow" d="M435 171 H765" stroke="#309F8B" stroke-width="2"/><rect x="817" y="1" width="382" height="187" rx="22" fill="#F0F9F5" stroke="#DDEBEA"/><g transform="translate(843 27)" stroke="#309F8B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 0 L27 5 V16 Q26 24 14 30 Q2 24 1 16 V5 Z M7 14 L12 19 L21 10"/></g><text x="892" y="49" font-size="29" fill="#243B53" font-weight="600" >Evaluation</text><text x="843" y="106" font-size="20" fill="#607D8B" font-weight="400" >Traces · Assertions · Replay</text><text x="843" y="151" font-size="19" fill="#607D8B" font-weight="400" >Make improvement measurable</text><path d="M843 171 H1173" stroke="#DCEAE9"/><path class="flow-slow" d="M843 171 H1173" stroke="#309F8B" stroke-width="2"/></g>
<rect x="1" y="1" width="1198" height="187" rx="28" fill="none" stroke="none"/>
</svg>
