<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="构建可靠的 Agent 系统">
<title>构建可靠的 Agent 系统</title>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F6FBFF"/><stop offset=".55" stop-color="#F3FAFB"/><stop offset="1" stop-color="#EBF8F0"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#69AFDD"/><stop offset="1" stop-color="#68C4AC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#A9D9EF" stop-opacity=".38"/><stop offset="1" stop-color="#A9D9EF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A3BCC8" opacity=".23"/></pattern>
  <clipPath id="clip"><rect x="1" y="1" width="1198" height="438" rx="28"/></clipPath>
  <style>text{font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}
      .flow{stroke-dasharray:14 180;animation:flow 7s linear infinite}
      .flow-slow{stroke-dasharray:10 240;animation:flow 11s linear infinite reverse}
      .float{animation:float 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .breathe{animation:breathe 5s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-776}}
      @keyframes float{50%{transform:translateY(-9px)}}
      @keyframes breathe{50%{opacity:.45}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
</defs>
<g clip-path="url(#clip)"><rect width="1200" height="440" fill="url(#paper)"/><rect x="640" width="560" height="440" fill="url(#dots)"/><circle cx="938" cy="195" r="275" fill="url(#glow)"/><rect x="52" y="43" width="28" height="4" rx="2" fill="url(#accent)"/><text x="94" y="51" font-size="15" fill="#607D8B" font-weight="600" letter-spacing="2">开发者 / 开源实践</text><text x="52" y="139" font-size="55" fill="#243B53" font-weight="700" >构建可靠的</text><text x="52" y="209" font-size="62" fill="#438BC5" font-weight="750" >Agent 系统。</text><text x="54" y="266" font-size="21" fill="#607D8B" font-weight="400" >以证据为起点，让每一次行动都可以被验证。</text><text x="54" y="311" font-size="17" fill="#607D8B" font-weight="400" >检索增强 / 上下文工程 / MCP / 可复现评测</text><path d="M54 362 H585" stroke="#CFE1E5"/><text x="54" y="397" font-size="16" fill="#607D8B" font-weight="400" >持续学习，认真构建。</text><path d="M670 105 C735 105 731 193 824 193 S930 77 1108 77" fill="none" stroke="#438BC5" stroke-width="20" opacity=".08"/><path d="M670 105 C735 105 731 193 824 193 S930 77 1108 77" fill="none" stroke="#438BC5" stroke-width="1.4" opacity=".35"/><path class="flow" style="animation-delay:-0s" d="M670 105 C735 105 731 193 824 193 S930 77 1108 77" fill="none" stroke="#438BC5" stroke-width="4" stroke-linecap="round"/><path d="M663 264 C750 264 725 193 824 193 S949 326 1138 326" fill="none" stroke="#309F8B" stroke-width="20" opacity=".08"/><path d="M663 264 C750 264 725 193 824 193 S949 326 1138 326" fill="none" stroke="#309F8B" stroke-width="1.4" opacity=".35"/><path class="flow" style="animation-delay:-2s" d="M663 264 C750 264 725 193 824 193 S949 326 1138 326" fill="none" stroke="#309F8B" stroke-width="4" stroke-linecap="round"/><path d="M690 357 C779 357 725 242 839 242 S955 174 1138 174" fill="none" stroke="#8CBBD4" stroke-width="20" opacity=".08"/><path d="M690 357 C779 357 725 242 839 242 S955 174 1138 174" fill="none" stroke="#8CBBD4" stroke-width="1.4" opacity=".35"/><path class="flow" style="animation-delay:-4s" d="M690 357 C779 357 725 242 839 242 S955 174 1138 174" fill="none" stroke="#8CBBD4" stroke-width="4" stroke-linecap="round"/><g class="float" style="animation-delay:-1s"><rect x="653" y="74" width="114" height="66" rx="18" fill="#FFFFFF" stroke="#D8E9EA"/><text x="710" y="98" font-size="12" fill="#438BC5" font-weight="600" text-anchor="middle" letter-spacing="2">01</text><text x="710" y="123" font-size="18" fill="#243B53" font-weight="600" text-anchor="middle">证据</text></g><g class="float" style="animation-delay:-2s"><rect x="819" y="161" width="114" height="66" rx="18" fill="#FFFFFF" stroke="#D8E9EA"/><text x="876" y="185" font-size="12" fill="#438BC5" font-weight="600" text-anchor="middle" letter-spacing="2">02</text><text x="876" y="210" font-size="18" fill="#243B53" font-weight="600" text-anchor="middle">上下文</text></g><g class="float" style="animation-delay:-3s"><rect x="995" y="141" width="114" height="66" rx="18" fill="#FFFFFF" stroke="#D8E9EA"/><text x="1052" y="165" font-size="12" fill="#309F8B" font-weight="600" text-anchor="middle" letter-spacing="2">03</text><text x="1052" y="190" font-size="18" fill="#243B53" font-weight="600" text-anchor="middle">工具</text></g><g class="float" style="animation-delay:-4s"><rect x="994" y="293" width="114" height="66" rx="18" fill="#FFFFFF" stroke="#D8E9EA"/><text x="1051" y="317" font-size="12" fill="#309F8B" font-weight="600" text-anchor="middle" letter-spacing="2">04</text><text x="1051" y="342" font-size="18" fill="#243B53" font-weight="600" text-anchor="middle">验证</text></g><circle class="breathe" cx="816" cy="357" r="5" fill="#77BFAE"/><circle cx="1164" cy="50" r="4" fill="#A4CBE2"/></g>
<rect x="1" y="1" width="1198" height="438" rx="28" fill="none" stroke="#DDEBEA"/>
</svg>
