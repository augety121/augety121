<g clip-path="url(#clip)"><rect width="720" height="694" fill="url(#paper)"/><text x="36" y="44" font-size="30" fill="#243B53" font-weight="600" >Make every step verifiable</text><path d="M360 196 V224 M360 340 V368 M360 484 V512 M48 570 H22 V138 H48" fill="none" stroke="#C2DFE3" stroke-width="2"/><path class="flow" d="M360 196 V224 M360 340 V368 M360 484 V512 M48 570 H22 V138 H48" fill="none" stroke="#59AAA9" stroke-width="3"/><path class="craft-arrow" d="M355 206 L360 214 L365 206" fill="none" stroke="#69AAA9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="craft-arrow" d="M355 350 L360 358 L365 350" fill="none" stroke="#69AAA9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="craft-arrow" d="M355 494 L360 502 L365 494" fill="none" stroke="#69AAA9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="craft-arrow" d="M34 133 L42 138 L34 143" fill="none" stroke="#69AAA9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect class="craft-step" x="48" y="80" width="624" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="70" y="104" width="4" height="25" rx="2" fill="#438BC5"/><text x="88" y="125" font-size="36" fill="#243B53" font-weight="600" >Define</text><text x="88" y="166" font-size="28" fill="#607D8B" font-weight="400" >Goals and boundaries</text><rect class="craft-step" x="48" y="224" width="624" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="70" y="248" width="4" height="25" rx="2" fill="#438BC5"/><text x="88" y="269" font-size="36" fill="#243B53" font-weight="600" >Build</text><text x="88" y="310" font-size="28" fill="#607D8B" font-weight="400" >A small, complete loop</text><rect class="craft-step" x="48" y="368" width="624" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="70" y="392" width="4" height="25" rx="2" fill="#309F8B"/><text x="88" y="413" font-size="36" fill="#243B53" font-weight="600" >Verify</text><text x="88" y="454" font-size="28" fill="#607D8B" font-weight="400" >Tests, traces and results</text><rect class="craft-step" x="48" y="512" width="624" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="70" y="536" width="4" height="25" rx="2" fill="#309F8B"/><text x="88" y="557" font-size="36" fill="#243B53" font-weight="600" >Iterate</text><text x="88" y="598" font-size="28" fill="#607D8B" font-weight="400" >Learn and improve</text><text x="360.0" y="675" font-size="26" fill="#607D8B" font-weight="400" text-anchor="middle">Keep the feedback loop open.</text></g>
