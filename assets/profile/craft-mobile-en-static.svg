<g clip-path="url(#clip)"><rect width="720" height="398" fill="url(#paper)"/><text x="36" y="44" font-size="24" fill="#243B53" font-weight="600" >Turn questions into verifiable progress</text><path d="M336 138 H384 M534 196 V234 M384 292 H336 M186 234 V196" fill="none" stroke="#C2DFE3" stroke-width="2"/><path class="flow" d="M336 138 H384 M534 196 V234 M384 292 H336 M186 234 V196" fill="none" stroke="#59AAA9" stroke-width="3"/><rect x="36" y="80" width="300" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="58" y="104" width="4" height="25" rx="2" fill="#438BC5"/><text x="76" y="125" font-size="26" fill="#243B53" font-weight="600" >Define</text><text x="58" y="166" font-size="20" fill="#607D8B" font-weight="400" >Goals and boundaries</text><rect x="384" y="80" width="300" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="406" y="104" width="4" height="25" rx="2" fill="#438BC5"/><text x="424" y="125" font-size="26" fill="#243B53" font-weight="600" >Build</text><text x="406" y="166" font-size="20" fill="#607D8B" font-weight="400" >A small, complete loop</text><rect x="384" y="234" width="300" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="406" y="258" width="4" height="25" rx="2" fill="#309F8B"/><text x="424" y="279" font-size="26" fill="#243B53" font-weight="600" >Verify</text><text x="406" y="320" font-size="20" fill="#607D8B" font-weight="400" >Tests, traces and results</text><rect x="36" y="234" width="300" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="58" y="258" width="4" height="25" rx="2" fill="#309F8B"/><text x="76" y="279" font-size="26" fill="#243B53" font-weight="600" >Iterate</text><text x="58" y="320" font-size="20" fill="#607D8B" font-weight="400" >Learn and improve</text><text x="360.0" y="379" font-size="17" fill="#607D8B" font-weight="400" text-anchor="middle">Keep the feedback loop open.</text></g>
<rect x="1" y="1" width="718" height="396" rx="28" fill="none" stroke="#DDEBEA"/>
