<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="把问题变成可验证的进展">
<title>把问题变成可验证的进展</title>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F6FBFF"/><stop offset=".55" stop-color="#F3FAFB"/><stop offset="1" stop-color="#EBF8F0"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#69AFDD"/><stop offset="1" stop-color="#68C4AC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#A9D9EF" stop-opacity=".38"/><stop offset="1" stop-color="#A9D9EF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A3BCC8" opacity=".23"/></pattern>
  <clipPath id="clip"><rect x="1" y="1" width="1198" height="258" rx="28"/></clipPath>
  <style>text{font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}.flow{stroke-dasharray:14 180}.flow-slow{stroke-dasharray:10 240}</style>
</defs>
<g clip-path="url(#clip)"><rect width="1200" height="260" fill="url(#paper)"/><text x="36" y="44" font-size="26" fill="#243B53" font-weight="600" >把问题变成可验证的进展</text><path d="M300 141 H324 M588 141 H612 M876 141 H900 M1032 199 V221 H168 V199" fill="none" stroke="#C2DFE3" stroke-width="2"/><path class="flow" d="M300 141 H324 M588 141 H612 M876 141 H900 M1032 199 V221 H168 V199" fill="none" stroke="#59AAA9" stroke-width="3"/><rect x="36" y="83" width="264" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="58" y="107" width="4" height="25" rx="2" fill="#438BC5"/><text x="76" y="128" font-size="24" fill="#243B53" font-weight="600" >拆解问题</text><text x="58" y="169" font-size="17" fill="#607D8B" font-weight="400" >明确目标与边界</text><rect x="324" y="83" width="264" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="346" y="107" width="4" height="25" rx="2" fill="#438BC5"/><text x="364" y="128" font-size="24" fill="#243B53" font-weight="600" >小步实现</text><text x="346" y="169" font-size="17" fill="#607D8B" font-weight="400" >做出最小完整闭环</text><rect x="612" y="83" width="264" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="634" y="107" width="4" height="25" rx="2" fill="#309F8B"/><text x="652" y="128" font-size="24" fill="#243B53" font-weight="600" >证据验证</text><text x="634" y="169" font-size="17" fill="#607D8B" font-weight="400" >用测试与轨迹检查结果</text><rect x="900" y="83" width="264" height="116" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="922" y="107" width="4" height="25" rx="2" fill="#309F8B"/><text x="940" y="128" font-size="24" fill="#243B53" font-weight="600" >复盘迭代</text><text x="922" y="169" font-size="17" fill="#607D8B" font-weight="400" >把经验沉淀为下一步</text><text x="600.0" y="241" font-size="15" fill="#607D8B" font-weight="400" text-anchor="middle">保持反馈，让每次迭代都有依据。</text></g>
<rect x="1" y="1" width="1198" height="258" rx="28" fill="none" stroke="#DDEBEA"/>
</svg>
