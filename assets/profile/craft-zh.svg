<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="324" viewBox="0 0 1200 324" role="img" aria-label="把问题变成可验证的进展">
<title>把问题变成可验证的进展</title>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F6FBFF"/><stop offset=".55" stop-color="#F3FAFB"/><stop offset="1" stop-color="#EBF8F0"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#69AFDD"/><stop offset="1" stop-color="#68C4AC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#A9D9EF" stop-opacity=".38"/><stop offset="1" stop-color="#A9D9EF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A3BCC8" opacity=".23"/></pattern>
  <clipPath id="clip"><rect x="1" y="1" width="1198" height="322" rx="28"/></clipPath>
  <style>text{font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}.flow{stroke-dasharray:14 180}.flow-slow{stroke-dasharray:10 240}
      .flow{stroke-dasharray:14 180;animation:flow 7s linear infinite}
      .flow-slow{stroke-dasharray:10 240;animation:flowSlow 11s linear infinite reverse}
      .float{animation:float 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .breathe{animation:breathe 5s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-776}}
      @keyframes flowSlow{to{stroke-dashoffset:-1000}}
      @keyframes float{50%{transform:translateY(-9px)}}
      @keyframes breathe{50%{opacity:.45}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
</defs>
<g clip-path="url(#clip)"><rect width="1200" height="324" fill="url(#paper)"/><text x="36" y="49" font-size="32" fill="#243B53" font-weight="600" >把问题变成可验证的进展</text><path d="M300 164 H324 M588 164 H612 M876 164 H900 M1032 240 V268 H168 V240" fill="none" stroke="#C2DFE3" stroke-width="2"/><path class="flow" d="M300 164 H324 M588 164 H612 M876 164 H900 M1032 240 V268 H168 V240" fill="none" stroke="#59AAA9" stroke-width="3"/><path class="craft-arrow" d="M307 159 L315 164 L307 169" fill="none" stroke="#69AAA9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="craft-arrow" d="M595 159 L603 164 L595 169" fill="none" stroke="#69AAA9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="craft-arrow" d="M883 159 L891 164 L883 169" fill="none" stroke="#69AAA9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="craft-arrow" d="M614 263 L606 268 L614 273" fill="none" stroke="#69AAA9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect class="craft-step" x="36" y="88" width="264" height="152" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="58" y="112" width="4" height="25" rx="2" fill="#438BC5"/><text x="76" y="133" font-size="30" fill="#243B53" font-weight="600" >拆解问题</text><text x="58" y="176" font-size="23" fill="#607D8B" font-weight="400" >明确目标与边界</text><rect class="craft-step" x="324" y="88" width="264" height="152" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="346" y="112" width="4" height="25" rx="2" fill="#438BC5"/><text x="364" y="133" font-size="30" fill="#243B53" font-weight="600" >小步实现</text><text x="346" y="176" font-size="23" fill="#607D8B" font-weight="400" >做出最小完整闭环</text><rect class="craft-step" x="612" y="88" width="264" height="152" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="634" y="112" width="4" height="25" rx="2" fill="#309F8B"/><text x="652" y="133" font-size="30" fill="#243B53" font-weight="600" >证据验证</text><text x="634" y="176" font-size="23" fill="#607D8B" font-weight="400" >用测试与轨迹</text><text x="634" y="207" font-size="23" fill="#607D8B" font-weight="400" >检查结果</text><rect class="craft-step" x="900" y="88" width="264" height="152" rx="18" fill="#FFFFFF" fill-opacity=".88" stroke="#D8E9EA"/><rect x="922" y="112" width="4" height="25" rx="2" fill="#309F8B"/><text x="940" y="133" font-size="30" fill="#243B53" font-weight="600" >复盘迭代</text><text x="922" y="176" font-size="23" fill="#607D8B" font-weight="400" >把经验沉淀</text><text x="922" y="207" font-size="23" fill="#607D8B" font-weight="400" >为下一步</text><text x="600.0" y="305" font-size="22" fill="#607D8B" font-weight="400" text-anchor="middle">保持反馈，让每次迭代都有依据。</text></g>
<rect x="1" y="1" width="1198" height="322" rx="28" fill="none" stroke="#DDEBEA"/>
</svg>
