name: Update Profile Statistics

on:
  workflow_dispatch:
  schedule:
    # 北京时间每天 08:15。GitHub 的定时任务可能延迟。
    - cron: '15 0 * * *'
  push:
    paths:
      - 'scripts/update_profile_data.py'
      - 'scripts/build_profile_assets.py'
      - '.github/workflows/update-profile-stats.yml'

permissions:
  contents: read

concurrency:
  group: profile-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: 读取真实数据并生成中英文卡片
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_profile_data.py
      - name: 生成薄荷色贡献贪吃蛇
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/profile/contribution-snake.svg?color_snake=#438BC5&color_dots=#EAF2F4,#D4EDE7,#ABDBCF,#75C4B3,#3CA28E
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 验证资源
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: profile-data
          retention-days: 1
          path: |
            assets/profile/stats-zh.svg
            assets/profile/stats-en.svg
            assets/profile/stats-mobile-zh.svg
            assets/profile/stats-mobile-en.svg
            assets/profile/contributions-static.svg
            assets/profile/contribution-snake.svg

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: profile-data
          path: assets/profile
      - name: 只提交生成的数据图片
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile/stats-zh.svg assets/profile/stats-en.svg assets/profile/stats-mobile-zh.svg assets/profile/stats-mobile-en.svg assets/profile/contributions-static.svg assets/profile/contribution-snake.svg
          if git diff --cached --quiet; then
            echo '数据没有变化'
            exit 0
          fi
          git commit -m 'chore: refresh bilingual profile activity'
          git push

