name: Check Profile
on:
  push:
    paths: ['README*', 'assets/profile/**', 'scripts/**', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['README*', 'assets/profile/**', 'scripts/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: Check reproducible visual assets
        run: |
          python scripts/build_profile_assets.py
          git diff --exit-code -- assets/profile/hero* assets/profile/project* assets/profile/footer*
